name: Build and release

on:
  workflow_dispatch:
    inputs:
      artifacts_only:
        description: 'Only build artifacts, skip creating draft release'
        type: boolean
        default: false

jobs:
  build-console:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [win-x64, win-x86, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm, linux-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version and tag
        shell: pwsh
        run: |
          $commitCount = (git rev-list --count HEAD)
          $commitSha = (git log --pretty=format:'%h' -n 1 HEAD)
          $version = (Select-Xml -Path ./src/Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerXML
          "VERSION={0}" -f ($version) >> $env:GITHUB_ENV
          "BUILD_VERSION={0}" -f ($version -replace '^(.*)\.\d+.*$', "`$1.$commitCount") >> $env:GITHUB_ENV
          "BUILD_VERSION_SHA={0}" -f ($commitSha) >> $env:GITHUB_ENV

      - name: Write version and tag
        shell: pwsh
        run: |
          "VERSION: ${{ env.VERSION }}"
          "BUILD_VERSION: ${{ env.BUILD_VERSION }}"
          "BUILD_VERSION_SHA: ${{ env.BUILD_VERSION_SHA }}"
          "${{ env.BUILD_VERSION }}" > hst-imager.release-tag.txt
          "hst-imager_v${{ env.BUILD_VERSION }}-${{ env.BUILD_VERSION_SHA }}" > hst-imager.release-version.txt

      - name: Upload release tag artifact
        uses: actions/upload-artifact@v7
        with:
          name: hst-imager.release-tag
          path: hst-imager.release-tag.txt
          retention-days: 3
        if: matrix.target == 'win-x64'

      - name: Upload release version artifact
        uses: actions/upload-artifact@v7
        with:
          name: hst-imager.release-version
          path: hst-imager.release-version.txt
          retention-days: 3
        if: matrix.target == 'win-x64'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore tool
        working-directory: ./src
        shell: pwsh
        run: dotnet tool restore

      - name: Build console app
        working-directory: src/Hst.Imager.ConsoleApp
        shell: pwsh
        run: |
          dotnet publish --configuration Release -p:PublishSingleFile=True -p:SelfContained=True -p:RuntimeIdentifier=${{ matrix.target }} -p:PublishReadyToRun=True -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishDir=publish/${{ matrix.target }}

      - name: List console app output
        working-directory: src/Hst.Imager.ConsoleApp/publish
        shell: pwsh
        run: |
          Get-ChildItem -recurse

      - name: Build console app artifact
        id: build_console_app_artifact
        working-directory: ./src
        shell: pwsh
        run: |
          cd "Hst.Imager.ConsoleApp/publish/${{ matrix.target }}"
          $artifactName='hst-imager.console.${{ matrix.target }}.zip'
          Remove-Item -Path *.pdb
          Remove-Item -Path *.so
          $exeFileName=((Get-ChildItem -Filter 'Hst.Imager.ConsoleApp*') | Select -First 1).Name
          Rename-Item -Path $exeFileName -NewName ($exeFileName -replace 'Hst.Imager.ConsoleApp', 'hst.imager')
          zip -r $artifactName *
          $artifactPath=((Get-ChildItem -Filter $artifactName) | Select -First 1).FullName
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT

      - name: Upload console app artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.build_console_app_artifact.outputs.artifact_name }}"
          path: "${{ steps.build_console_app_artifact.outputs.artifact_path }}"
          retention-days: 3

  # code signing windows console app artifacts with azure artifact signing, which requires windows runner.
  # skipped unless repository variable ARTIFACT_SIGNING_ENABLED is set to 'true'.
  sign-console:
    needs: build-console
    if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        target: [win-x64, win-x86, win-arm64]

    steps:
      - name: Download console app artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.${{ matrix.target }}.zip
          path: unsigned

      - name: Extract console app artifact
        shell: pwsh
        run: Expand-Archive -Path 'unsigned/hst-imager.console.${{ matrix.target }}.zip' -DestinationPath console

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign console app
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\console
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build signed console app artifact
        shell: pwsh
        run: Compress-Archive -Path console/* -DestinationPath 'hst-imager.console.${{ matrix.target }}.zip' -Force

      - name: Upload signed console app artifact
        uses: actions/upload-artifact@v7
        with:
          name: hst-imager.console.${{ matrix.target }}.zip
          path: hst-imager.console.${{ matrix.target }}.zip
          retention-days: 3
          overwrite: true

  # code signing and notarization of macos console app artifacts with apple developer id certificate, which requires macos runner.
  # skipped unless repository variable MACOS_SIGNING_ENABLED is set to 'true'.
  sign-console-macos:
    needs: build-console
    if: vars.MACOS_SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            src/Hst.Imager.AvaloniaApp/Packaging/macos

      - name: Download console app artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.${{ matrix.target }}.zip
          path: unsigned

      - name: Extract console app artifact
        shell: pwsh
        run: |
          # ditto preserves executable permissions
          ditto -x -k 'unsigned/hst-imager.console.${{ matrix.target }}.zip' console
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract console app artifact" }

      - name: Setup macOS code signing
        shell: pwsh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: ./.github/scripts/macos-signing-setup.ps1

      - name: Sign console app
        shell: pwsh
        run: |
          # sign all mach-o binaries with hardened runtime required for notarization
          $entitlementsPath=(Resolve-Path './src/Hst.Imager.AvaloniaApp/Packaging/macos/entitlements.plist').Path
          $binaries=@(gci console -File -Recurse | Where-Object { (file -b $_.FullName) -match 'Mach-O' })
          if ($binaries.Count -eq 0) { throw "No Mach-O binaries found in console app artifact" }
          foreach ($binary in $binaries) {
            codesign --force --sign $env:MACOS_SIGN_IDENTITY --keychain $env:MACOS_KEYCHAIN --options runtime --timestamp --entitlements $entitlementsPath $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign '$($binary.FullName)'" }
            codesign --verify --strict --verbose=2 $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to verify signature of '$($binary.FullName)'" }
          }

      - name: Build signed console app artifact
        shell: pwsh
        run: |
          ditto -c -k console 'hst-imager.console.${{ matrix.target }}.zip'
          if ($LASTEXITCODE -ne 0) { throw "Failed to create signed console app artifact" }

        # standalone binaries can't be stapled, gatekeeper checks notarization online on first run
      - name: Notarize console app
        shell: pwsh
        run: ./.github/scripts/macos-notarize.ps1 -Path 'hst-imager.console.${{ matrix.target }}.zip'

      - name: Upload signed console app artifact
        uses: actions/upload-artifact@v7
        with:
          name: hst-imager.console.${{ matrix.target }}.zip
          path: hst-imager.console.${{ matrix.target }}.zip
          retention-days: 3
          overwrite: true

      - name: Cleanup macOS code signing
        shell: pwsh
        run: security delete-keychain $env:MACOS_KEYCHAIN
        if: always() && env.MACOS_KEYCHAIN != ''

  build-gui:
    runs-on: ${{ matrix.os }}
    # id token is used by azure login for code signing windows gui app
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            rids: [win-x64, win-arm64]
          - os: macos-latest
            rids: [osx-x64, osx-arm64]
          - os: ubuntu-latest
            rids: [linux-x64, linux-arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version and tag
        shell: pwsh
        run: |
          $commitCount = (git rev-list --count HEAD)
          $commitSha = (git log --pretty=format:'%h' -n 1 HEAD)
          $version = (Select-Xml -Path ./src/Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerXML
          "VERSION={0}" -f ($version) >> $env:GITHUB_ENV
          "BUILD_VERSION={0}" -f ($version -replace '^(.*)\.\d+.*$', "`$1.$commitCount") >> $env:GITHUB_ENV
          "BUILD_VERSION_SHA={0}" -f ($commitSha) >> $env:GITHUB_ENV

      - name: Show version
        shell: pwsh
        run: |
          "VERSION: ${{ env.VERSION }}"
          "BUILD_VERSION: ${{ env.BUILD_VERSION }}"
          "BUILD_VERSION_SHA: ${{ env.BUILD_VERSION_SHA }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore tool
        working-directory: ./src
        shell: pwsh
        run: dotnet tool restore

      - name: Build gui app for Windows x64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
        if: matrix.os == 'windows-latest'

      - name: Build gui app for Windows arm64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-arm64
        if: matrix.os == 'windows-latest'

        # code signing windows gui app with azure artifact signing.
        # skipped unless repository variable ARTIFACT_SIGNING_ENABLED is set to 'true'.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
        if: matrix.os == 'windows-latest' && vars.ARTIFACT_SIGNING_ENABLED == 'true'

        # sign published exe used by portable artifacts. velopack pack signs remaining exe files like setup and update
      - name: Sign gui app for Windows
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\src\Hst.Imager.AvaloniaApp\publish
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        if: matrix.os == 'windows-latest' && vars.ARTIFACT_SIGNING_ENABLED == 'true'

      - name: Create Velopack signing metadata
        shell: pwsh
        run: |
          $metadataPath=(Join-Path $env:RUNNER_TEMP -ChildPath 'artifact-signing-metadata.json')
          @{
            Endpoint = '${{ vars.ARTIFACT_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}'
            CertificateProfileName = '${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}'
          } | ConvertTo-Json | Set-Content -Path $metadataPath
          "VPK_SIGN_FILE={0}" -f $metadataPath >> $env:GITHUB_ENV
        if: matrix.os == 'windows-latest' && vars.ARTIFACT_SIGNING_ENABLED == 'true'

      - name: Pack gui app for Windows x64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: |
          $signArgs=if ($env:VPK_SIGN_FILE) { @('--azureTrustedSignFile', $env:VPK_SIGN_FILE) } else { @() }
          dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/win-x64 --outputDir artifacts/win-x64 --packTitle "Hst Imager" --runtime win-x64 --mainExe Hst.Imager.AvaloniaApp.exe --icon Assets/hst.imager.ico @signArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to pack gui app for Windows x64" }
        if: matrix.os == 'windows-latest'

      - name: Pack gui app for Windows arm64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: |
          $signArgs=if ($env:VPK_SIGN_FILE) { @('--azureTrustedSignFile', $env:VPK_SIGN_FILE) } else { @() }
          dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/win-arm64 --outputDir artifacts/win-arm64 --packTitle "Hst Imager" --runtime win-arm64 --mainExe Hst.Imager.AvaloniaApp.exe --icon Assets/hst.imager.ico @signArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to pack gui app for Windows arm64" }
        if: matrix.os == 'windows-latest'

      - name: Set Windows x64 setup artifact
        id: windows_x64_setup
        shell: pwsh
        run: |
          $artifactName='hst-imager.gui.win-x64-setup.exe'
          $artifactFile=(gci './src/Hst.Imager.AvaloniaApp/artifacts/win-x64' -Filter '*Setup.exe' | Select-Object -First 1).FullName
          Rename-Item $artifactFile -NewName $artifactName
          $artifactPath=(Join-Path (Split-Path $artifactFile -Parent) -ChildPath $artifactName)
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'windows-latest'

      - name: Upload Windows x64 setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.windows_x64_setup.outputs.artifact_name }}"
          path: "${{ steps.windows_x64_setup.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'windows-latest'

      - name: Set Windows arm64 setup artifact
        id: windows_arm64_setup
        shell: pwsh
        run: |
          $artifactName='hst-imager.gui.win-arm64-setup.exe'
          $artifactFile=(gci './src/Hst.Imager.AvaloniaApp/artifacts/win-arm64' -Filter '*Setup.exe' | Select-Object -First 1).FullName
          Rename-Item $artifactFile -NewName $artifactName
          $artifactPath=(Join-Path (Split-Path $artifactFile -Parent) -ChildPath $artifactName)
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'windows-latest'

      - name: Upload Windows arm64 setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.windows_arm64_setup.outputs.artifact_name }}"
          path: "${{ steps.windows_arm64_setup.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'windows-latest'

      - name: Create Windows x64 portable artifact
        id: windows_x64_portable
        shell: pwsh
        run: |
          # portable zip only containing standalone single file exe renamed to hst-imager.gui.exe
          $artifactName='hst-imager.gui.win-x64-portable.zip'
          $publishDir=(Resolve-Path './src/Hst.Imager.AvaloniaApp/publish/win-x64').Path
          $exePath=(Join-Path $publishDir -ChildPath 'Hst.Imager.AvaloniaApp.exe')
          if (-not (Test-Path $exePath)) { throw "Exe '$exePath' not found" }
          $artifactDir=(Join-Path (Resolve-Path './src/Hst.Imager.AvaloniaApp').Path -ChildPath 'artifacts/win-x64-portable')
          $stagingDir=(Join-Path $artifactDir -ChildPath 'staging')
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $portableExePath=(Join-Path $stagingDir -ChildPath 'hst-imager.gui.exe')
          Copy-Item -Path $exePath -Destination $portableExePath
          $artifactPath=(Join-Path $artifactDir -ChildPath $artifactName)
          Compress-Archive -Path $portableExePath -DestinationPath $artifactPath -Force
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'windows-latest'

      - name: Upload Windows x64 portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.windows_x64_portable.outputs.artifact_name }}"
          path: "${{ steps.windows_x64_portable.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'windows-latest'

      - name: Create Windows arm64 portable artifact
        id: windows_arm64_portable
        shell: pwsh
        run: |
          # portable zip only containing standalone single file exe renamed to hst-imager.gui.exe
          $artifactName='hst-imager.gui.win-arm64-portable.zip'
          $publishDir=(Resolve-Path './src/Hst.Imager.AvaloniaApp/publish/win-arm64').Path
          $exePath=(Join-Path $publishDir -ChildPath 'Hst.Imager.AvaloniaApp.exe')
          if (-not (Test-Path $exePath)) { throw "Exe '$exePath' not found" }
          $artifactDir=(Join-Path (Resolve-Path './src/Hst.Imager.AvaloniaApp').Path -ChildPath 'artifacts/win-arm64-portable')
          $stagingDir=(Join-Path $artifactDir -ChildPath 'staging')
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $portableExePath=(Join-Path $stagingDir -ChildPath 'hst-imager.gui.exe')
          Copy-Item -Path $exePath -Destination $portableExePath
          $artifactPath=(Join-Path $artifactDir -ChildPath $artifactName)
          Compress-Archive -Path $portableExePath -DestinationPath $artifactPath -Force
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'windows-latest'

      - name: Upload Windows arm64 portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.windows_arm64_portable.outputs.artifact_name }}"
          path: "${{ steps.windows_arm64_portable.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'windows-latest'

      - name: Build gui app for macOS x64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -o publish/osx-x64
        if: matrix.os == 'macos-latest'

      - name: Build gui app for macOS arm64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o publish/osx-arm64
        if: matrix.os == 'macos-latest'

        # code signing and notarization of macos gui app with apple developer id certificate.
        # skipped unless repository variable MACOS_SIGNING_ENABLED is set to 'true'.
      - name: Setup macOS code signing
        shell: pwsh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: ./.github/scripts/macos-signing-setup.ps1
        if: matrix.os == 'macos-latest' && vars.MACOS_SIGNING_ENABLED == 'true'

        # velopack signs app bundle with hardened runtime, notarizes and staples it, when macos code signing is set up
      - name: Pack gui app for macOS x64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: |
          $signArgs=if ($env:MACOS_KEYCHAIN) { @('--signAppIdentity', $env:MACOS_SIGN_IDENTITY, '--signEntitlements', 'Packaging/macos/entitlements.plist', '--keychain', $env:MACOS_KEYCHAIN, '--notaryProfile', $env:MACOS_NOTARY_PROFILE) } else { @() }
          dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/osx-x64 --outputDir artifacts/osx-x64 --packTitle "Hst Imager" --runtime osx-x64 --mainExe Hst.Imager.AvaloniaApp --icon Assets/hst.imager.icns @signArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to pack gui app for macOS x64" }
        if: matrix.os == 'macos-latest'

      - name: Pack gui app for macOS arm64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: |
          $signArgs=if ($env:MACOS_KEYCHAIN) { @('--signAppIdentity', $env:MACOS_SIGN_IDENTITY, '--signEntitlements', 'Packaging/macos/entitlements.plist', '--keychain', $env:MACOS_KEYCHAIN, '--notaryProfile', $env:MACOS_NOTARY_PROFILE) } else { @() }
          dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/osx-arm64 --outputDir artifacts/osx-arm64 --packTitle "Hst Imager" --runtime osx-arm64 --mainExe Hst.Imager.AvaloniaApp --icon Assets/hst.imager.icns @signArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to pack gui app for macOS arm64" }
        if: matrix.os == 'macos-latest'

      - name: Setup dmgbuild
        shell: pwsh
        run: |
          # install dmgbuild in venv and combine dmg background images into multi resolution tiff for retina displays
          $venvDir=(Join-Path $env:RUNNER_TEMP -ChildPath 'dmgbuild')
          python3 -m venv $venvDir
          & (Join-Path $venvDir -ChildPath 'bin/pip') install dmgbuild
          if ($LASTEXITCODE -ne 0) { throw "Failed to install dmgbuild" }
          $packagingDir=(Resolve-Path './src/Hst.Imager.AvaloniaApp/Packaging/macos').Path
          $backgroundPath=(Join-Path $env:RUNNER_TEMP -ChildPath 'dmg-background.tiff')
          tiffutil -cathidpicheck (Join-Path $packagingDir -ChildPath 'dmg-background.png') (Join-Path $packagingDir -ChildPath 'dmg-background@2x.png') -out $backgroundPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to create dmg background '$backgroundPath'" }
          "DMGBUILD={0}" -f (Join-Path $venvDir -ChildPath 'bin/dmgbuild') >> $env:GITHUB_ENV
          "DMG_SETTINGS={0}" -f (Join-Path $packagingDir -ChildPath 'dmg-settings.py') >> $env:GITHUB_ENV
          "DMG_BACKGROUND={0}" -f $backgroundPath >> $env:GITHUB_ENV
        if: matrix.os == 'macos-latest'

      - name: Create macOS x64 dmg artifact
        id: macos_x64_dmg
        shell: pwsh
        run: |
          # create dmg with app bundle from velopack portable zip and a link to applications for drag and drop install
          $artifactName='hst-imager.gui.osx-x64.dmg'
          $artifactsDir=(Resolve-Path './src/Hst.Imager.AvaloniaApp/artifacts/osx-x64').Path
          $portableZip=(gci $artifactsDir -Filter '*-Portable.zip' | Select-Object -First 1).FullName
          $stagingDir=(Join-Path $artifactsDir -ChildPath 'dmg')
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          ditto -x -k $portableZip $stagingDir
          $appPath=(gci $stagingDir -Filter '*.app' -Directory | Select-Object -First 1).FullName
          if (-not $appPath) { throw "No app bundle found in '$portableZip'" }
          $artifactPath=(Join-Path $artifactsDir -ChildPath $artifactName)
          & $env:DMGBUILD -s $env:DMG_SETTINGS -D "app=$appPath" -D "background=$env:DMG_BACKGROUND" 'Hst Imager' $artifactPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to create dmg '$artifactPath'" }
          # sign, notarize and staple dmg, when macos code signing is set up
          if ($env:MACOS_KEYCHAIN) {
            codesign --sign $env:MACOS_SIGN_IDENTITY --keychain $env:MACOS_KEYCHAIN --timestamp $artifactPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign dmg '$artifactPath'" }
            ./.github/scripts/macos-notarize.ps1 -Path $artifactPath -Staple
          }
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'macos-latest'

      - name: Upload macOS x64 dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.macos_x64_dmg.outputs.artifact_name }}"
          path: "${{ steps.macos_x64_dmg.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'macos-latest'

      - name: Create macOS arm64 dmg artifact
        id: macos_arm64_dmg
        shell: pwsh
        run: |
          # create dmg with app bundle from velopack portable zip and a link to applications for drag and drop install
          $artifactName='hst-imager.gui.osx-arm64.dmg'
          $artifactsDir=(Resolve-Path './src/Hst.Imager.AvaloniaApp/artifacts/osx-arm64').Path
          $portableZip=(gci $artifactsDir -Filter '*-Portable.zip' | Select-Object -First 1).FullName
          $stagingDir=(Join-Path $artifactsDir -ChildPath 'dmg')
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          ditto -x -k $portableZip $stagingDir
          $appPath=(gci $stagingDir -Filter '*.app' -Directory | Select-Object -First 1).FullName
          if (-not $appPath) { throw "No app bundle found in '$portableZip'" }
          $artifactPath=(Join-Path $artifactsDir -ChildPath $artifactName)
          & $env:DMGBUILD -s $env:DMG_SETTINGS -D "app=$appPath" -D "background=$env:DMG_BACKGROUND" 'Hst Imager' $artifactPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to create dmg '$artifactPath'" }
          # sign, notarize and staple dmg, when macos code signing is set up
          if ($env:MACOS_KEYCHAIN) {
            codesign --sign $env:MACOS_SIGN_IDENTITY --keychain $env:MACOS_KEYCHAIN --timestamp $artifactPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign dmg '$artifactPath'" }
            ./.github/scripts/macos-notarize.ps1 -Path $artifactPath -Staple
          }
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'macos-latest'

      - name: Upload macOS arm64 dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.macos_arm64_dmg.outputs.artifact_name }}"
          path: "${{ steps.macos_arm64_dmg.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'macos-latest'

      - name: Cleanup macOS code signing
        shell: pwsh
        run: security delete-keychain $env:MACOS_KEYCHAIN
        if: always() && matrix.os == 'macos-latest' && env.MACOS_KEYCHAIN != ''

      - name: Build gui app for Linux x64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish/linux-x64
        if: matrix.os == 'ubuntu-latest'

      - name: Build gui app for Linux arm64
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet publish -c Release -r linux-arm64 --self-contained -p:PublishSingleFile=true -o publish/linux-arm64
        if: matrix.os == 'ubuntu-latest'

      - name: Pack gui app for Linux x64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/linux-x64 --outputDir artifacts/linux-x64 --packTitle "Hst Imager" --runtime linux-x64 --mainExe Hst.Imager.AvaloniaApp --icon Assets/hst.imager.png
        if: matrix.os == 'ubuntu-latest'

      - name: Pack gui app for Linux arm64 (Velopack)
        working-directory: ./src/Hst.Imager.AvaloniaApp
        shell: pwsh
        run: dotnet vpk pack --packId HstImager --packVersion ${{ env.BUILD_VERSION }} --packDir publish/linux-arm64 --outputDir artifacts/linux-arm64 --packTitle "Hst Imager" --runtime linux-arm64 --mainExe Hst.Imager.AvaloniaApp --icon Assets/hst.imager.png
        if: matrix.os == 'ubuntu-latest'

      - name: Set Linux x64 AppImage artifact
        id: linux_x64_appimage
        shell: pwsh
        run: |
          $artifactName='hst-imager.gui.linux-x64.AppImage'
          $artifactFile=(gci './src/Hst.Imager.AvaloniaApp/artifacts/linux-x64' -Filter '*.AppImage' | Select-Object -First 1).FullName
          Rename-Item $artifactFile -NewName $artifactName
          $artifactPath=(Join-Path (Split-Path $artifactFile -Parent) -ChildPath $artifactName)
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'ubuntu-latest'

      - name: Upload Linux x64 AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.linux_x64_appimage.outputs.artifact_name }}"
          path: "${{ steps.linux_x64_appimage.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'ubuntu-latest'

      - name: Set Linux arm64 AppImage artifact
        id: linux_arm64_appimage
        shell: pwsh
        run: |
          $artifactName='hst-imager.gui.linux-arm64.AppImage'
          $artifactFile=(gci './src/Hst.Imager.AvaloniaApp/artifacts/linux-arm64' -Filter '*.AppImage' | Select-Object -First 1).FullName
          Rename-Item $artifactFile -NewName $artifactName
          $artifactPath=(Join-Path (Split-Path $artifactFile -Parent) -ChildPath $artifactName)
          Write-Output "artifact_name=$artifactName" >> $Env:GITHUB_OUTPUT
          Write-Output "artifact_path=$artifactPath" >> $Env:GITHUB_OUTPUT
        if: matrix.os == 'ubuntu-latest'

      - name: Upload Linux arm64 AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.linux_arm64_appimage.outputs.artifact_name }}"
          path: "${{ steps.linux_arm64_appimage.outputs.artifact_path }}"
          retention-days: 3
        if: matrix.os == 'ubuntu-latest'

  publish:
    needs: [build-console, sign-console, sign-console-macos, build-gui]
    # skip draft release, when only building artifacts. runs when sign console jobs are skipped, but not when any job failed
    if: ${{ !inputs.artifacts_only && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    # id token, attestations and artifact metadata are used by build provenance attestation of release artifacts
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release tag artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.release-tag

      - name: Download release version artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.release-version

      - name: Set release tag version
        shell: pwsh
        run: |
          "RELEASE_TAG={0}" -f (gc hst-imager.release-tag.txt) >> $env:GITHUB_ENV
          "RELEASE_VERSION={0}" -f (gc hst-imager.release-version.txt) >> $env:GITHUB_ENV
              
        # windows
      - name: Download Console Windows 64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.win-x64.zip

      - name: Download Console Windows 32-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.win-x86.zip

      - name: Download Console Windows arm64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.win-arm64.zip
        
      - name: Download Gui Windows x64 setup artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.win-x64-setup.exe

      - name: Download Gui Windows arm64 setup artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.win-arm64-setup.exe

      - name: Download Gui Windows x64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.win-x64-portable.zip

      - name: Download Gui Windows arm64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.win-arm64-portable.zip

        # macos
      - name: Download Console macOS 64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.osx-x64.zip

      - name: Download Console macOS arm64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.osx-arm64.zip

      - name: Download Gui macOS 64-bit dmg artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.osx-x64.dmg

      - name: Download Gui macOS arm64 dmg artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.osx-arm64.dmg

        # linux
      - name: Download Console Linux 64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.linux-x64.zip

      - name: Download Console Linux arm-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.linux-arm.zip

      - name: Download Console Linux arm64-bit zip artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.console.linux-arm64.zip

      - name: Download Gui Linux 64-bit appimage artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.linux-x64.AppImage

      - name: Download Gui Linux arm64-bit appimage artifact
        uses: actions/download-artifact@v8
        with:
          name: hst-imager.gui.linux-arm64.AppImage

      - name: Version artifacts
        shell: pwsh
        run: |
          Rename-Item -Path hst-imager.console.win-x64.zip -NewName "${{ env.RELEASE_VERSION }}_console_windows_x64.zip"
          Rename-Item -Path hst-imager.console.win-x86.zip -NewName "${{ env.RELEASE_VERSION }}_console_windows_x86.zip"
          Rename-Item -Path hst-imager.console.win-arm64.zip -NewName "${{ env.RELEASE_VERSION }}_console_windows_arm64.zip"
          Rename-Item -Path hst-imager.gui.win-x64-setup.exe -NewName "${{ env.RELEASE_VERSION }}_gui_windows_x64_setup.exe"
          Rename-Item -Path hst-imager.gui.win-arm64-setup.exe -NewName "${{ env.RELEASE_VERSION }}_gui_windows_arm64_setup.exe"
          Rename-Item -Path hst-imager.gui.win-x64-portable.zip -NewName "${{ env.RELEASE_VERSION }}_gui_windows_x64_portable.zip"
          Rename-Item -Path hst-imager.gui.win-arm64-portable.zip -NewName "${{ env.RELEASE_VERSION }}_gui_windows_arm64_portable.zip"
          Rename-Item -Path hst-imager.console.osx-x64.zip -NewName "${{ env.RELEASE_VERSION }}_console_macos_x64.zip"
          Rename-Item -Path hst-imager.console.osx-arm64.zip -NewName "${{ env.RELEASE_VERSION }}_console_macos_arm64.zip"
          Rename-Item -Path hst-imager.gui.osx-x64.dmg -NewName "${{ env.RELEASE_VERSION }}_gui_macos_x64.dmg"
          Rename-Item -Path hst-imager.gui.osx-arm64.dmg -NewName "${{ env.RELEASE_VERSION }}_gui_macos_arm64.dmg"
          Rename-Item -Path hst-imager.console.linux-x64.zip -NewName "${{ env.RELEASE_VERSION }}_console_linux_x64.zip"
          Rename-Item -Path hst-imager.console.linux-arm.zip -NewName "${{ env.RELEASE_VERSION }}_console_linux_arm.zip"
          Rename-Item -Path hst-imager.console.linux-arm64.zip -NewName "${{ env.RELEASE_VERSION }}_console_linux_arm64.zip"
          Rename-Item -Path hst-imager.gui.linux-x64.AppImage -NewName "${{ env.RELEASE_VERSION }}_gui_linux_x64.AppImage"
          Rename-Item -Path hst-imager.gui.linux-arm64.AppImage -NewName "${{ env.RELEASE_VERSION }}_gui_linux_arm64.AppImage"

        # attest build provenance of release artifacts, verify with: gh attestation verify <file> --repo henrikstengaard/hst-imager
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "${{ env.RELEASE_VERSION }}_*"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "${{ env.RELEASE_VERSION }}" `
            --notes "Prerelease of ${{ env.RELEASE_VERSION }}" `
            --draft `
            --prerelease `
            "${{ env.RELEASE_VERSION }}_console_windows_x64.zip" `
            "${{ env.RELEASE_VERSION }}_console_windows_x86.zip" `
            "${{ env.RELEASE_VERSION }}_console_windows_arm64.zip" `
            "${{ env.RELEASE_VERSION }}_gui_windows_x64_setup.exe" `
            "${{ env.RELEASE_VERSION }}_gui_windows_arm64_setup.exe" `
            "${{ env.RELEASE_VERSION }}_gui_windows_x64_portable.zip" `
            "${{ env.RELEASE_VERSION }}_gui_windows_arm64_portable.zip" `
            "${{ env.RELEASE_VERSION }}_console_macos_x64.zip" `
            "${{ env.RELEASE_VERSION }}_console_macos_arm64.zip" `
            "${{ env.RELEASE_VERSION }}_gui_macos_x64.dmg" `
            "${{ env.RELEASE_VERSION }}_gui_macos_arm64.dmg" `
            "${{ env.RELEASE_VERSION }}_console_linux_x64.zip" `
            "${{ env.RELEASE_VERSION }}_console_linux_arm.zip" `
            "${{ env.RELEASE_VERSION }}_console_linux_arm64.zip" `
            "${{ env.RELEASE_VERSION }}_gui_linux_x64.AppImage" `
            "${{ env.RELEASE_VERSION }}_gui_linux_arm64.AppImage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }